name: Manual Build Target

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib

      - name: Install GNU Arm Embedded Toolchain
        uses: jetli/arm-none-eabi-gcc-action@v1
        with:
          release: '10.3-2021.10'

      - name: Build Firmware
        run: |
          make TARGET=KAPONGA_KIWIF4_12S

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: betaflight-hex-file
          path: obj/*.hex
