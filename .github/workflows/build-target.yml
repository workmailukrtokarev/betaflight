name: Manual Build Target

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ARM Toolchain
        uses: xmake-io/github-action-setup-arm-gcc@v1
        with:
          version: '10.3.1'

      - name: Build Firmware
        run: |
          make TARGET=KIWIF4
