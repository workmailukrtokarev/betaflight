name: Manual Build Target

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: betaflight/betaflight-build:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Firmware
        run: |
          make KIWIF4

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: betaflight-kiwif4-hex
          path: obj/*.hex
