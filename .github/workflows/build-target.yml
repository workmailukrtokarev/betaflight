name: Manual Build Target

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Compiler and Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-arm-none-eabi gcc-multilib ccache

      - name: Build Target
        run: |
          make EXTRA_FLAGS="" KIWIF4

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: betaflight-kiwif4-hex
          path: obj/*.hex
