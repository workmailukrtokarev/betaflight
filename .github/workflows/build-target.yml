name: Manual Build Target

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install ARM GCC Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make

      - name: Build Firmware
        run: |
          make TARGET=KAPONGA_KIWIF4_12S

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: betaflight-hex-file
          path: obj/*.hex
