name: Build KAPONGA_KIWIF4_12S

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install base build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git

      - name: Install ARM GCC toolchain (official make target)
        run: make arm_sdk_install

      - name: Hydrate config submodule (src/config)
        run: make configs

      - name: Build firmware
        run: make CONFIG=KAPONGA_KIWIF4_12S -j"$(nproc)"

      - name: Upload .hex as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: betaflight-kaponga-hex
          path: |
            obj/*.hex
            obj/*.bin
